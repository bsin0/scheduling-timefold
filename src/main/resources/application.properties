# ============================================================
# Admin login (single account — see SecurityConfig)
# ============================================================
# CHANGE THIS PASSWORD before this app is reachable outside your LXC.
app.admin.username=admin
app.admin.password=changeme123


# ============================================================
# Web server port
# ============================================================
# Default Spring Boot port (8080) clashes with code-server running on
# this LXC, so we run on 8081 instead.
server.port=8081

# ============================================================
# H2 database configuration
# ============================================================
# Stores data in a file called "churchband" in a "data" folder at the
# project root (created automatically if it doesn't exist). This means
# your roster data survives between app restarts — it's not wiped each
# time, unlike an in-memory H2 database.
spring.datasource.url=jdbc:h2:file:./data/churchband
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=Password01

# ============================================================
# JPA / Hibernate behavior
# ============================================================
# "update" means: on startup, Hibernate compares your @Entity classes
# to the actual database tables and adds any missing tables/columns.
# It will NOT delete columns or tables that no longer match an entity,
# so it's safe to use while the schema is still evolving. Once this
# app is stable in production, this is typically switched to "validate"
# (checks the schema matches but never changes it) and schema changes
# are made through proper migration scripts instead.
spring.jpa.hibernate.ddl-auto=update

# Prints the actual SQL Hibernate runs to the console — very useful
# while learning/debugging, since you can see exactly what queries your
# repository methods generate. Turn this off (set to false) once you
# don't need to see it anymore, since it's noisy in normal use.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
# H2 web console (optional developer convenience)
# ============================================================
# Enables a browser-based database viewer at http://localhost:8081/h2-console
# once the app is running. Handy for looking at your tables directly
# without writing SQL scripts. Not something end users would ever see —
# purely a development tool, safe to leave on for now.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true